services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    image: kms/backend:latest
    container_name: kms-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 51478
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      SQL_SERVER: ${SQL_SERVER}
      SQL_INSTANCE_NAME: ${SQL_INSTANCE_NAME:-}
      SQL_PORT: ${SQL_PORT:-1433}
      SQL_DATABASE: ${SQL_DATABASE:-KMS}
      SQL_USER: ${SQL_USER:-sa}
      SQL_PASSWORD: ${SQL_PASSWORD}
      SQL_ENCRYPT: ${SQL_ENCRYPT:-false}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: /app/backend/storage
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PRESIGNED_EXPIRES_IN: ${AWS_S3_PRESIGNED_EXPIRES_IN:-900}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - kms-storage-data:/app/backend/storage
    networks:
      - kms-net
    expose:
      - "51478"
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:51478/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        tag: "kms-backend"

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-KMS}
        VITE_APP_LOGO: ${VITE_APP_LOGO:-/logos/PHEnlinea.svg}
    image: kms/frontend:latest
    container_name: kms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks:
      - kms-net
    expose:
      - "80"
    mem_limit: 128m
    mem_reservation: 64m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        tag: "kms-frontend"

  proxy:
    image: nginx:1.27-alpine
    container_name: kms-proxy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./infra/docker/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kms-net
    ports:
      - "${APP_PORT:-8080}:80"
    mem_limit: 128m
    mem_reservation: 64m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        tag: "kms-proxy"

volumes:
  kms-storage-data:
    name: kms-storage-data

networks:
  kms-net:
    driver: bridge
    name: kms-net
