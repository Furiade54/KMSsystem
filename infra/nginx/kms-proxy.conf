# ============================================================
# KMS - Reverse Proxy unificado (edge interno)
# Peticiones  :8080 -> /api al backend kms-backend:51478
#                /    al frontend kms-frontend:80
# Same port for SPA + API (mejor CORS: VITE_API_URL=/api)
# ============================================================

upstream kms_backend {
    server backend:51478 max_fails=3 fail_timeout=5s;
}

upstream kms_frontend {
    server frontend:80 max_fails=3 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;

    # Max upload 50MB (Multer backend 50MB)
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;

    access_log /var/log/nginx/access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    # Compresion
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;

    # Healthcheck
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"proxy"}';
    }

    # API al backend con buffering off (streaming SSE/uploads)
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://kms_backend/api/;
    }

    # Assets estáticos y SPA al frontend
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_pass http://kms_frontend;
    }
}
